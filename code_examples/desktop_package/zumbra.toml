[app]
name = "Zumbra Packaged App"
version = "1.0.0"
identifier = "dev.zumbra.packaged"
entry = "src/main.zum"
icon = "assets/icon.png"
icon_linux = "assets/icon.png"
icon_windows = "assets/icon.ico"
icon_macos = "assets/icon.icns"

[build]
output = "dist/zumbra-packaged-app"
compiler = "auto"
release = true

[package]
description = "A small packaged application written in Zumbra."
publisher = "Zumbra"
license = "Apache-2.0"
category = "Development"
copyright = "Copyright Zumbra contributors"

[linux]
# runtime_files = ["runtime/libSDL3.so.0", "runtime/libSDL3_ttf.so.0"]
dependencies = ["libc6"]
recommends = ["libsdl3-0", "libsdl3-ttf0"]

[windows]
# runtime_files = ["runtime/SDL3.dll", "runtime/SDL3_ttf.dll"]
console = true
installer = "nsis"

[macos]
# runtime_files = ["runtime/libSDL3.dylib", "runtime/libSDL3_ttf.dylib"]
minimum_version = "12.0"
category = "public.app-category.developer-tools"

[updates]
url = "https://updates.example.invalid/zumbra"
channel = "stable"

[assets]
include = ["assets/**"]
exclude = ["**/*.tmp"]
max_file_bytes = 16_777_216
max_total_bytes = 67_108_864
