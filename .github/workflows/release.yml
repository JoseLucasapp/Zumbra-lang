name: Build and publish Zumbra CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: zumbra-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    name: Linux AMD64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libhiredis-dev \
            libpq-dev \
            libsqlite3-dev \
            libssl-dev \
            zlib1g-dev

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Release workflow must run from a v-prefixed tag." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run canonical release gate
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: scripts/test-release-platform.sh

      - name: Build Linux package
        shell: bash
        run: |
          package_root="zumbra-${VERSION}-linux-amd64"
          mkdir -p "dist/${package_root}"

          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/${package_root}/zumbra" \
            .

          test "$(dist/${package_root}/zumbra --version)" = "$VERSION"
          cp README.MD LICENSE-APACHE "dist/${package_root}/"
          tar -C dist -czf "dist/${package_root}.tar.gz" "$package_root"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: zumbra-linux-amd64
          path: dist/*-linux-amd64.tar.gz
          if-no-files-found: error

  windows-amd64:
    name: Windows AMD64
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite

      - name: Resolve release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Release workflow must run from a v-prefixed tag." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate Windows CLI host
        env:
          CC: gcc
          CGO_ENABLED: "1"
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          scripts/test-release-platform.sh

      - name: Build Windows package
        env:
          CC: gcc
          CGO_ENABLED: "1"
        run: |
          export PATH="/ucrt64/bin:$PATH"
          package_root="zumbra-${VERSION}-windows-amd64"
          mkdir -p "dist/${package_root}"

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/${package_root}/zumbra.exe" \
            .

          test "$(dist/${package_root}/zumbra.exe --version | tr -d '\r')" = "$VERSION"
          cp README.MD LICENSE-APACHE "dist/${package_root}/"

          # Copy only non-system DLLs actually required by the CGO executable.
          while IFS= read -r dll; do
            [[ -n "$dll" ]] && cp "$dll" "dist/${package_root}/"
          done < <(ldd "dist/${package_root}/zumbra.exe" | awk '/\/ucrt64\/bin\// {print $3}')

      - name: Package Windows archive
        shell: pwsh
        run: |
          $root = "zumbra-$env:VERSION-windows-amd64"
          Compress-Archive -Path "dist\$root" -DestinationPath "dist\$root.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: zumbra-windows-amd64
          path: dist/*-windows-amd64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: amd64
            machine: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install SQLite development files
        shell: bash
        run: |
          brew install sqlite
          sqlite_prefix="$(brew --prefix sqlite)"
          echo "CGO_CFLAGS=-I${sqlite_prefix}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${sqlite_prefix}/lib" >> "$GITHUB_ENV"

      - name: Resolve release version and validate runner
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Release workflow must run from a v-prefixed tag." >&2
            exit 1
          fi
          test "$(uname -m)" = "${{ matrix.machine }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate macOS CLI host
        shell: bash
        env:
          CC: clang
          CGO_ENABLED: "1"
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: scripts/test-release-platform.sh

      - name: Build macOS package
        shell: bash
        env:
          CC: clang
          CGO_ENABLED: "1"
        run: |
          package_root="zumbra-${VERSION}-macos-${{ matrix.arch }}"
          mkdir -p "dist/${package_root}"

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/${package_root}/zumbra" \
            .

          test "$(dist/${package_root}/zumbra --version)" = "$VERSION"
          file "dist/${package_root}/zumbra"
          cp README.MD LICENSE-APACHE "dist/${package_root}/"
          tar -C dist -czf "dist/${package_root}.tar.gz" "$package_root"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: zumbra-macos-${{ matrix.arch }}
          path: dist/*-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - linux-amd64
      - windows-amd64
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: zumbra-*
          path: release
          merge-multiple: true

      - name: Add source archive and checksums
        shell: bash
        run: |
          expected=(
            "zumbra-${VERSION}-linux-amd64.tar.gz"
            "zumbra-${VERSION}-windows-amd64.zip"
            "zumbra-${VERSION}-macos-arm64.tar.gz"
            "zumbra-${VERSION}-macos-amd64.tar.gz"
          )

          for artifact in "${expected[@]}"; do
            test -f "release/${artifact}" || {
              echo "Missing release artifact: ${artifact}" >&2
              exit 1
            }
          done

          git archive \
            --format=zip \
            --prefix="Zumbra-${VERSION}/" \
            -o "release/zumbra-${VERSION}-source.zip" \
            "$GITHUB_SHA"

          (
            cd release
            sha256sum * > SHA256SUMS
            cat SHA256SUMS
          )

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${VERSION}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Zumbra ${VERSION}" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Zumbra ${VERSION}" \
              --generate-notes
          fi
